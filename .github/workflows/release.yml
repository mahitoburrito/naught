name: Build & Release

on:
  push:
    branches:
      - main
  # Validate on PRs too. Without this nothing exercised the suite before main, so the
  # gate rotted unnoticed for two weeks and every release was blocked behind it. The
  # release jobs below stay push-only.
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-2022
    runs-on: ${{ matrix.os }}
    # Windows runs and stays visible, but does not hold the release chain.
    #
    # One scenario has never passed there: the workspace-source test opens a
    # websocket to a PowerShell session and types a `cd`. The input is received
    # and recorded as a block, and PowerShell never executes it — the block sits
    # in "running" with empty output through three re-sends across thirty
    # seconds, so it is not a readiness or timing problem. The prompt markers
    # never arrive either, which is why the session's phase stays "unknown".
    #
    # That looks like a real gap in the PowerShell integration rather than a
    # test defect, and it wants a Windows machine to diagnose. Until then it was
    # blocking every release on every platform: nothing had shipped since
    # v1.0.39. Linux and macOS still gate fully, Windows artifacts are still
    # built and published by the jobs below, and this line should come out as
    # soon as that scenario passes.
    continue-on-error: ${{ matrix.os == 'windows-2022' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux shell validators
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zsh fish
          # Runners ship group-writable directories in zsh's fpath, so compinit stops a
          # child interactive zsh on "insecure directories ... [y] or abort [n]?" and it
          # never reaches its prompt. The suite also sets skip_global_compinit, which
          # covers Ubuntu; this covers everything else that reaches compinit.
          zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null \
            | sudo xargs -r chmod g-w,o-w 2>/dev/null || true

      - name: Expose Git Bash to Node child processes
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Install Python setuptools (macOS)
        if: runner.os == 'macOS'
        run: pip3 install --break-system-packages setuptools

      - name: Install Python setuptools (Linux)
        if: runner.os == 'Linux'
        run: pip3 install setuptools

      - name: Install Python setuptools (Windows)
        if: runner.os == 'Windows'
        run: pip install setuptools

      - name: Install dependencies
        run: npm ci

      - name: Run feature regression suite
        run: npm run test:features

      - name: Validate POSIX shell adapters
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n resources/shell-integration/openui.bash
          zsh -n resources/shell-integration/openui.zsh
          fish -n resources/shell-integration/openui.fish
          bash -n claude-code-plugin/hooks/status-reporter.sh

      - name: Validate macOS shell adapters
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash -n resources/shell-integration/openui.bash
          zsh -n resources/shell-integration/openui.zsh
          bash -n claude-code-plugin/hooks/status-reporter.sh

      - name: Validate PowerShell adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'resources/shell-integration/openui.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell shell integration failed to parse.'
          }

      - name: Exercise Windows PowerShell 5.1 adapter
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . (Resolve-Path 'resources/shell-integration/openui.ps1')
          prompt | Out-Null
          cmd /c exit 7
          prompt | Out-Null
          if ($LASTEXITCODE -ne 7) {
            throw 'PowerShell adapter lost native exit status.'
          }
          Get-Item . | Out-Null
          prompt | Out-Null

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix client audit --audit-level=high

  version:
    needs: validate
    # Push-only: a pull_request run stops after validate. build, publish and
    # update-homebrew all chain off this job, so they skip with it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine next version and tag
        id: bump
        run: |
          # Get latest version from git tags (source of truth)
          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT="0.0.0"
          else
            CURRENT="${LATEST_TAG#v}"
          fi

          # Bump patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          TAG="v${NEXT}"

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            targets: dmg zip
          - os: macos-latest
            platform: mac
            arch: x64
            targets: dmg zip
          # Pinned: windows-latest (2025 image) breaks node-gyp's Visual Studio
          # detection, so node-pty fails to compile (runs red since 2026-06-09).
          - os: windows-2022
            platform: win
            arch: x64
            targets: nsis zip
          - os: ubuntu-latest
            platform: linux
            arch: x64
            targets: AppImage deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Python setuptools (for node-gyp)
        run: pip3 install --break-system-packages setuptools
        if: runner.os == 'macOS'

      - name: Install Python setuptools (Linux)
        run: pip3 install setuptools
        if: runner.os == 'Linux'

      - name: Install Python setuptools (Windows)
        run: pip install setuptools
        if: runner.os == 'Windows'

      - name: Mark release-channel build (enables auto-update by default)
        run: echo '{"channel":"release"}' > resources/build-info.json
        shell: bash

      - name: Set version from tag
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Build electron
        run: npm run build:electron

      - name: Build Electron app
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.targets }} --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: [version, build]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Merge artifacts and build latest-mac.yml
        run: |
          VERSION="${{ needs.version.outputs.version }}"

          # Collect all files into a flat release dir
          mkdir -p release
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            cp "$f" "release/$(basename "$f")"
          done

          # Helper: sha512 in base64 (format electron-updater expects)
          sha512b64() { sha512sum "$1" | awk '{print $1}' | xxd -r -p | base64 -w0; }

          ARM64_ZIP_SHA=$(sha512b64 release/OpenUI-${VERSION}-arm64.zip)
          ARM64_ZIP_SIZE=$(stat -c%s release/OpenUI-${VERSION}-arm64.zip)
          ARM64_DMG_SHA=$(sha512b64 release/OpenUI-${VERSION}-arm64.dmg)
          ARM64_DMG_SIZE=$(stat -c%s release/OpenUI-${VERSION}-arm64.dmg)
          X64_ZIP_SHA=$(sha512b64 release/OpenUI-${VERSION}-x64.zip)
          X64_ZIP_SIZE=$(stat -c%s release/OpenUI-${VERSION}-x64.zip)
          X64_DMG_SHA=$(sha512b64 release/OpenUI-${VERSION}-x64.dmg)
          X64_DMG_SIZE=$(stat -c%s release/OpenUI-${VERSION}-x64.dmg)

          cat > release/latest-mac.yml << EOF
          version: ${VERSION}
          files:
            - url: OpenUI-${VERSION}-arm64.zip
              sha512: ${ARM64_ZIP_SHA}
              size: ${ARM64_ZIP_SIZE}
            - url: OpenUI-${VERSION}-arm64.dmg
              sha512: ${ARM64_DMG_SHA}
              size: ${ARM64_DMG_SIZE}
            - url: OpenUI-${VERSION}-x64.zip
              sha512: ${X64_ZIP_SHA}
              size: ${X64_ZIP_SIZE}
            - url: OpenUI-${VERSION}-x64.dmg
              sha512: ${X64_DMG_SHA}
              size: ${X64_DMG_SIZE}
          path: OpenUI-${VERSION}-arm64.zip
          sha512: ${ARM64_ZIP_SHA}
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'
          EOF

          sed -i 's/^          //' release/latest-mac.yml

          echo "=== Merged latest-mac.yml ==="
          cat release/latest-mac.yml

      - name: Create release tag after every build succeeds
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Generate release checksums
        working-directory: release
        run: |
          CHECKSUM_FILE=$(mktemp)
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$CHECKSUM_FILE"
          mv "$CHECKSUM_FILE" SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS

  update-homebrew:
    needs: [version, publish]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Get SHA256 of arm64 DMG
          ARM64_URL="https://github.com/mahitoburrito/openui-desktop/releases/download/v${VERSION}/OpenUI-${VERSION}-arm64.dmg"
          ARM64_SHA=$(curl -sL "$ARM64_URL" | sha256sum | awk '{print $1}')

          # Get SHA256 of x64 DMG
          X64_URL="https://github.com/mahitoburrito/openui-desktop/releases/download/v${VERSION}/OpenUI-${VERSION}-x64.dmg"
          X64_SHA=$(curl -sL "$X64_URL" | sha256sum | awk '{print $1}')

          # Clone the tap repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/mahitoburrito/homebrew-tap.git"
          cd homebrew-tap

          # Write updated cask
          cat > Casks/openui-desktop.rb << CASK
          cask "openui-desktop" do
            arch arm: "arm64", intel: "x64"
            version "${VERSION}"

            if Hardware::CPU.arm?
              url "https://github.com/mahitoburrito/openui-desktop/releases/download/v#{version}/OpenUI-#{version}-arm64.dmg"
              sha256 "${ARM64_SHA}"
            else
              url "https://github.com/mahitoburrito/openui-desktop/releases/download/v#{version}/OpenUI-#{version}-x64.dmg"
              sha256 "${X64_SHA}"
            end

            name "OpenUI Desktop"
            desc "AI Agent Command Center — manage multiple coding agents on an infinite canvas"
            homepage "https://github.com/mahitoburrito/openui-desktop"

            app "OpenUI.app"

            zap trash: [
              "~/.openui-desktop",
            ]
          end
          CASK

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Casks/openui-desktop.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/openui-desktop.rb
          git commit -m "Update openui-desktop to v${VERSION}" || true
          git push
